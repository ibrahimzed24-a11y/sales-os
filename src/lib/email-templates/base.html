<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>{{headline}} — Valioz Health</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
  <style>
    @import url("https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;700&display=swap");
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    body { margin: 0; padding: 0; width: 100% !important; background-color: {{valioz_canvas}}; }
    table { border-collapse: collapse !important; mso-table-lspace: 0; mso-table-rspace: 0; }
    table, td { mso-table-lspace: 0; mso-table-rspace: 0; }
    img { border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; display: block; }
    a { text-decoration: none; color: inherit; }
    p { margin: 0; padding: 0; }
    .ExternalClass, .ExternalClass p, .ExternalClass td, .ExternalClass div, .ExternalClass span, .ExternalClass font { line-height: 100%; }
    .read-msg { width: 100%; background-color: {{valioz_canvas}}; }
    .h-serif { font-family: "EB Garamond", Georgia, "Times New Roman", serif; }
    .h-sans  { font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    @media only screen and (max-width: 600px) {
      .w600   { width: 100% !important; max-width: 100% !important; }
      .stack  { display: block !important; width: 100% !important; }
      .ctr    { text-align: center !important; }
      .hide   { display: none !important; }
      .btn a  { display: block !important; width: 100% !important; box-sizing: border-box !important; }
      .logo-v { width: 132px !important; height: auto !important; }
      .logo-c { width: 120px !important; height: auto !important; }
      .pad24  { padding: 24px !important; }
    }
  </style>
</head>
<body class="read-msg" style="background-color:{{valioz_canvas}}; margin:0; padding:0;">

  <!-- PREHEADER -->
  <span class="preheader hide" style="display:none; max-height:0; overflow:hidden; font-size:1px; line-height:1px; color:{{valioz_canvas}};">
    {{headline}} — Valioz Health
  </span>

  <!-- VALIOZ OUTER WRAPPER (sender brand) -->
  <table class="w600" role="presentation" cellspacing="0" cellpadding="0" border="0"
         align="center" width="600" style="background-color:{{valioz_canvas}}; width:600px; max-width:600px; margin:0 auto;">
    <tr>
      <td align="center" style="padding:24px 16px 8px 16px;">

        <!-- VALIOZ HEADER / LOGO -->
        <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
          <tr>
            <td align="left" style="padding-bottom:16px;">
              <a href="{{valioz_site_url}}" target="_blank" style="text-decoration:none;">
                <img class="logo-v" src="{{valioz_logo_url}}" alt="Valioz Health" width="115" height="48"
                     style="width:115px; height:auto; display:block; border:0;">
              </a>
            </td>
          </tr>
        </table>

        <!-- MAIN CONTAINER (Valioz shell) -->
        <table class="w600 stack" role="presentation" cellspacing="0" cellpadding="0" border="0"
               width="100%" style="background-color:{{valioz_white}}; border:1px solid {{valioz_line}}; border-radius:16px; overflow:hidden; max-width:600px; width:100%;">

          <!-- CLINIC-BRANDED CONTENT BODY (injected) -->
          {{content_block}}

          <!-- /CLINIC CONTENT -->

        </table>
        <!-- /MAIN CONTAINER -->

      </td>
    </tr>

    <!-- VALIOZ FOOTER (sender brand, compliance) -->
    <tr>
      <td align="center" style="padding:24px 16px 40px 16px;">
        <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
          <tr>
            <td align="center" style="padding:0 16px 18px 16px; color:{{valioz_muted}};
                 font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
                 font-size:11px; line-height:1.5;">
              Valioz Health | <a href="{{valioz_site_url}}" target="_blank"
                   style="color:{{valioz_muted}}; text-decoration:underline;">{{valioz_site_url}}</a><br>
              <span style="color:#B9C0C9;">© 2026 Valioz Health · {{valioz_address}}</span>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:0 16px 10px 16px;">
              <a href="UNSUBSCRIBE_LINK" target="_blank"
                 style="color:#B9C0C9; text-decoration:underline; font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
                        font-size:11px; margin:0 8px;">Unsubscribe</a>
              <span style="color:#B9C0C9; font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
                         font-size:11px; margin:0 8px;">|</span>
              <a href="{{valioz_site_url}}" target="_blank"
                 style="color:#B9C0C9; text-decoration:underline; font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
                        font-size:11px; margin:0 8px;">Privacy</a>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:0 16px 0 16px; color:#B9C0C9;
                 font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
                 font-size:10px; line-height:1.4;">
              HIPAA notice: Valioz Health does not collect or request protected health information (PHI) via email. Please do not reply with patient details.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>

</body>
</html>
